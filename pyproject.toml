[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ellmos-talk"
version = "0.1.0"
description = "Dual-loop live speech & visual companion engine for BACH and Open-Ocean (Buddha, Gemini, Claude, Codex)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ellmos-ai" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
keywords = [
    "voice-agent",
    "conversational-ai",
    "dual-loop",
    "turn-taking",
    "barge-in",
    "wake-word",
    "sentence-streaming",
    "visual-companion",
    "local-first",
    "zero-egress",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ellmos-ai/ellmos-talk"
Documentation = "https://github.com/ellmos-ai/ellmos-talk/blob/main/SKILL.md"
Repository = "https://github.com/ellmos-ai/ellmos-talk"
Changelog = "https://github.com/ellmos-ai/ellmos-talk/blob/main/CHANGELOG.md"
Security = "https://github.com/ellmos-ai/ellmos-talk/blob/main/SECURITY.md"
Issues = "https://github.com/ellmos-ai/ellmos-talk/issues"

[project.optional-dependencies]
voice = ["ellmos-voice-io @ git+https://github.com/ellmos-ai/ellmos-voice-io.git@dcb4b3bfa83bc8a6c3c1bffc6faa0a9d05195029"]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
ellmos-talk = "ellmos_talk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ellmos_talk = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = [".git", ".pytest_cache", ".pytest_temp", ".pytest_tmp*", ".ruff_cache", "__pycache__", "build", "dist", ".venv"]
