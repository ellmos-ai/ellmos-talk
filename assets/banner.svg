<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <style>
      .font-sans {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      }
      .font-mono {
        font-family: 'Cascadia Code', Consolas, Monaco, monospace;
      }
    </style>

    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Ambient Glow Radials -->
    <radialGradient id="glow-p" cx="170" cy="140" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#080c14" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-s" cx="550" cy="160" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#080c14" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter for Glassmorphic Elements -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base Layer -->
  <rect width="1200" height="300" fill="url(#bg-grad)" />

  <!-- Technical Coordinate Grid Overlay -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200" />
    <path d="M100 0 V300 M200 0 V300 M300 0 V300 M400 0 V300 M500 0 V300 M600 0 V300 M700 0 V300 M800 0 V300 M900 0 V300 M1000 0 V300 M1100 0 V300" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="170" cy="140" r="200" fill="url(#glow-p)" />
  <circle cx="550" cy="160" r="220" fill="url(#glow-s)" />

  <!-- Left Accent Bar -->
  <rect x="0" y="0" width="5" height="300" fill="#fbbf24" />

  <!-- Left Domain Graphic Motif (x=40..310, y=30..270) -->
  
    <!-- Ellmos Talk: Dual-Loop Speech & Voice Reflex Companion -->
    <g transform="translate(45, 35)">
      <!-- Outer Loop: Deep Cortex Loop -->
      <circle cx="130" cy="110" r="92" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.4"/>
      <text x="75" y="18" class="font-mono" font-size="8" font-weight="700" fill="#fbbf24">DEEP CORTEX (LLM)</text>

      <!-- Inner Loop: Fast Reflex Turn-Taking (<250ms) -->
      <circle cx="130" cy="110" r="62" fill="none" stroke="#f59e0b" stroke-width="2" filter="url(#drop-shadow)"/>
      <text x="82" y="44" class="font-mono" font-size="7.5" font-weight="700" fill="#f59e0b">FAST REFLEX &lt;250ms</text>

      <!-- Center Microphone Body -->
      <g transform="translate(115, 84)">
        <rect x="7" y="0" width="16" height="30" rx="8" fill="#1c1917" stroke="#fbbf24" stroke-width="2"/>
        <line x1="10" y1="8" x2="20" y2="8" stroke="#fbbf24" stroke-width="1"/>
        <line x1="10" y1="14" x2="20" y2="14" stroke="#fbbf24" stroke-width="1"/>
        <line x1="10" y1="20" x2="20" y2="20" stroke="#fbbf24" stroke-width="1"/>
        <path d="M 0 16 A 15 15 0 0 0 30 16" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
        <line x1="15" y1="31" x2="15" y2="42" stroke="#f59e0b" stroke-width="2"/>
        <line x1="5" y1="42" x2="25" y2="42" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- Acoustic Waveform Bars Surrounding -->
      <line x1="90" y1="110" x2="90" y2="100" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="82" y1="110" x2="82" y2="90" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="74" y1="110" x2="74" y2="105" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>

      <line x1="170" y1="110" x2="170" y2="100" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="178" y1="110" x2="178" y2="90" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="186" y1="110" x2="186" y2="105" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Barge-in Signal Stamp -->
      <g transform="translate(45, 180)">
        <rect width="170" height="22" rx="4" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
        <circle cx="14" cy="11" r="3" fill="#22c55e"/>
        <text x="24" y="15" class="font-mono" font-size="8" font-weight="700" fill="#fbbf24">BARGE-IN DETECTION ACTIVE</text>
      </g>
    </g>
    

  <!-- Vertical Divider Line -->
  <line x1="330" y1="35" x2="330" y2="265" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Right Branding & Meta Information (x=360..1160) -->
  <g transform="translate(360, 0)">
    <!-- Top Category Badge -->
    <g transform="translate(0, 48)">
      <rect width="280.0" height="24" rx="5" fill="#fbbf24" fill-opacity="0.14" stroke="#fbbf24" stroke-width="1"/>
      <text x="12" y="16" class="font-mono" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#fbbf24">ELLMOS-AI // VOICE // DIALOG ENGINE</text>
    </g>

    <!-- Repository Title -->
    <text x="0" y="122" class="font-sans" font-size="44" font-weight="800" letter-spacing="-1" fill="url(#title-grad)">ellmos-talk</text>

    <!-- English Subtitle / Tagline -->
    <text x="0" y="158" class="font-sans" font-size="17" font-weight="500" fill="#94a3b8">Dual-Loop Live Speech, Reflex Turn-Taking &amp; Voice Companion</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 214)">
      
        <g transform="translate(0, 0)">
          <rect width="219" height="30" rx="15" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2"/>
          <text x="109.5" y="19" class="font-sans" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">🎙️ Fast Reflex (&lt;250ms)</text>
        </g>
        

        <g transform="translate(231, 0)">
          <rect width="173" height="30" rx="15" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
          <text x="86.5" y="19" class="font-sans" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">🧠 Deep Cortex Loop</text>
        </g>
        

        <g transform="translate(416, 0)">
          <rect width="188" height="30" rx="15" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
          <text x="94.0" y="19" class="font-sans" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">⚡ Barge-In Detection</text>
        </g>
        

        <g transform="translate(616, 0)">
          <rect width="143" height="30" rx="15" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
          <text x="71.5" y="19" class="font-sans" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">🌊 Ocean &amp; BACH</text>
        </g>
        
    </g>
  </g>
</svg>